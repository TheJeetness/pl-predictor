name: Update Data

on:
  schedule:
    - cron: "17 * * * *"   # hourly at :17 (off-peak minute gets scheduled sooner)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest data
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # a manual run always refreshes odds; scheduled runs do it every 6th hour
          ODDS_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          FPL_LEAGUE_ID: ${{ vars.FPL_LEAGUE_ID }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        run: |
          git config user.name "data-bot"
          git config user.email "actions@github.com"
          git add data/data.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M')"
          git push
